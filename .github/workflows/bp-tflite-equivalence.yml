name: BP TFLite equivalence

on:
  push:
    branches:
      - b19-blood-pressure
    paths:
      - ".github/workflows/bp-tflite-equivalence.yml"
      - "tools/bp/convert_and_validate.py"
      - "tools/bp/golden_bp15_windows.json"

permissions:
  contents: write

jobs:
  validate-and-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout B19 branch
        uses: actions/checkout@v4
        with:
          ref: b19-blood-pressure
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install conversion dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install "tensorflow==2.17.1" "numpy==1.26.4" "scipy==1.14.1" "h5py==3.11.0"

      - name: Convert H5 with built-in TFLite ops only and validate
        run: python tools/bp/convert_and_validate.py

      - name: Show validation report
        run: cat validation/bp/tflite_validation_report.json

      - name: Commit generated model and golden stage references
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add             app/src/main/assets/lstm_ppg_nonmixed.tflite             app/src/test/resources/bp_golden_stages.json             validation/bp/tflite_validation_report.json
          if git diff --cached --quiet; then
            echo "Generated outputs already up to date."
          else
            git commit -m "Add validated BP TFLite model and golden stages [skip ci]"
            git push origin HEAD:b19-blood-pressure
          fi
