name: B21 CSV and weekly validation

on:
  push:
    branches:
      - b21-csv-export
    paths:
      - "app/**"
      - "gradle/**"
      - ".github/workflows/b21-csv-export-validation.yml"

jobs:
  android-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout B21 branch
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Run JVM tests
        run: ./gradlew testDebugUnitTest --info --stacktrace

      - name: Compile app and instrumentation tests
        run: ./gradlew assembleDebug assembleDebugAndroidTest --stacktrace

      - name: Enable KVM permissions
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run Android instrumentation tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: default
          profile: Nexus 6
          disable-animations: true
          script: ./gradlew connectedDebugAndroidTest --stacktrace

      - name: Show PA numerical validation
        if: always()
        run: |
          grep -R "BP_ANDROID_TFLITE_MAX" app/build/outputs/androidTest-results app/build/reports/androidTests 2>/dev/null || true
          grep -R "BP_TRANSPORT_PIPELINE_MAX" app/build/outputs/androidTest-results app/build/reports/androidTests 2>/dev/null || true
