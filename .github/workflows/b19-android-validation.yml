name: B19 Android inference validation

on:
  push:
    branches:
      - b19-blood-pressure
    paths:
      - "app/build.gradle.kts"
      - "gradle/**"
      - "app/src/main/java/com/tallerbioing/ppgmonitor/bp/**"
      - "app/src/main/assets/lstm_ppg_nonmixed.tflite"
      - "app/src/test/java/com/tallerbioing/ppgmonitor/bp/**"
      - "app/src/test/resources/bp_golden_stages.txt"
      - "app/src/androidTest/java/com/tallerbioing/ppgmonitor/bp/**"
      - "app/src/androidTest/assets/bp_golden_stages.txt"
      - ".github/workflows/b19-android-validation.yml"

jobs:
  android-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout B19 branch
        uses: actions/checkout@v4
        with:
          ref: b19-blood-pressure

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Run JVM golden preprocessing tests
        run: ./gradlew testDebugUnitTest --info --stacktrace

      - name: Compile app and Android golden inference test
        run: ./gradlew assembleDebug assembleDebugAndroidTest --stacktrace

      - name: Show preprocessing maximum errors
        if: always()
        run: |
          grep -R "BP_STAGE_MAX" app/build/test-results/testDebugUnitTest || true
