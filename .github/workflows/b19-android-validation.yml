name: B19 Android inference validation

on:
  push:
    branches:
      - b19-blood-pressure
    paths:
      - "app/build.gradle.kts"
      - "gradle/**"
      - "app/src/main/java/com/tallerbioing/ppgmonitor/bp/**"
      - "app/src/main/java/com/tallerbioing/ppgmonitor/BleManager.kt"
      - "app/src/main/java/com/tallerbioing/ppgmonitor/SummaryScreen.kt"
      - "app/src/main/assets/lstm_ppg_nonmixed.tflite"
      - "app/src/test/java/com/tallerbioing/ppgmonitor/bp/**"
      - "app/src/test/resources/bp_golden_stages.txt"
      - "app/src/androidTest/java/com/tallerbioing/ppgmonitor/bp/**"
      - "app/src/androidTest/assets/bp_golden_stages.txt"
      - ".github/workflows/b19-android-validation.yml"

jobs:
  android-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout B19 branch
        uses: actions/checkout@v4
        with:
          ref: b19-blood-pressure

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Run JVM golden preprocessing tests
        run: ./gradlew testDebugUnitTest --info --stacktrace

      - name: Compile app and Android golden inference test
        run: ./gradlew assembleDebug assembleDebugAndroidTest --stacktrace

      - name: Show preprocessing maximum errors
        if: always()
        run: |
          grep -R "BP_STAGE_MAX" app/build/test-results/testDebugUnitTest || true

      - name: Enable KVM permissions
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run Android TFLite golden inference test
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: default
          profile: Nexus 6
          disable-animations: true
          script: ./gradlew connectedDebugAndroidTest --stacktrace

      - name: Show Android TFLite maximum errors
        if: always()
        run: |
          grep -R "BP_ANDROID_TFLITE_MAX" app/build/outputs/androidTest-results app/build/reports/androidTests 2>/dev/null || true
          grep -R "BP_TRANSPORT_PIPELINE_MAX" app/build/outputs/androidTest-results app/build/reports/androidTests 2>/dev/null || true
