name: B22 final UI validation

on:
  push:
    branches:
      - b22-final-ui
    paths:
      - "app/**"
      - ".github/workflows/b22-final-ui-validation.yml"

jobs:
  android-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout B22 branch
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Run JVM tests
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Compile app
        run: ./gradlew assembleDebug --stacktrace
